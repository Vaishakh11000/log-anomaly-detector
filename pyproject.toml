[project]
name = "log-anomaly-detector"
version = "0.1.0"
description = "LLM-powered log anomaly detector with MITRE ATT&CK narrative generation and adversarial robustness evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
